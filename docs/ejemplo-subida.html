<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejemplo de subida - Post-Cronos</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;background:#0a0a0a;color:#fff}
  label{display:block;margin:16px 0 6px;font-size:.9rem;color:#9a9a9a}
  input,button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #333;background:#141414;color:#fff}
  button{background:#6ec1e4;color:#000;font-weight:700;border:none;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.5;cursor:not-allowed}
  progress{display:block;width:100%;margin:16px 0}
  #status{margin-top:12px;line-height:1.5}
  #preview{max-width:100%;max-height:240px;margin-top:16px;border-radius:12px;display:none}
</style>
</head>
<body>

<h1>Subir dibujo</h1>
<p>Ejemplo mínimo para conectar una página con la API de Post-Cronos.</p>

<label for="school">Colegio / sede (opcional)</label>
<input id="school" placeholder="santa_ana" maxlength="40">

<label for="file">Archivo JPG</label>
<input id="file" type="file" accept="image/jpeg,.jpg,.jpeg">

<img id="preview" alt="Vista previa">

<progress id="progress" value="0" max="100"></progress>
<button id="btn" disabled>Subir y procesar</button>
<p id="status"></p>

<script>
const API = new URLSearchParams(location.search).get("api") || "";

const fileInput = document.getElementById("file");
const schoolInput = document.getElementById("school");
const preview = document.getElementById("preview");
const progress = document.getElementById("progress");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (!/^image\/jpe?g$/i.test(file.type)) {
    status.textContent = "Solo se aceptan archivos JPG.";
    btn.disabled = true;
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    status.textContent = "El archivo supera los 10 MB.";
    btn.disabled = true;
    return;
  }
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  status.textContent = "";
  btn.disabled = !API;
  if (!API) status.textContent = "Falta la URL de la API. Usá ?api=https://...";
});

async function subirJpg(file, school, onProgress) {
  const base = API.replace(/\/$/, "");

  const pedido = await fetch(base + "/api/upload-url", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      filename: file.name,
      contentType: "image/jpeg",
      size: file.size,
      school: school
    })
  });

  if (!pedido.ok) {
    const error = await pedido.json().catch(() => ({}));
    throw new Error(error.detail || "No se pudo preparar la subida");
  }

  const { uploadUrl, objectName } = await pedido.json();

  await new Promise((listo, fallo) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", uploadUrl);
    xhr.setRequestHeader("Content-Type", "image/jpeg");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) listo();
      else fallo(new Error("Error al subir el archivo"));
    };
    xhr.onerror = () => fallo(new Error("Error de conexión"));
    xhr.send(file);
  });

  return objectName;
}

async function esperarResultado(objectName) {
  const base = API.replace(/\/$/, "");
  const url = base + "/api/status?object=" + encodeURIComponent(objectName);

  for (let i = 0; i < 30; i++) {
    const respuesta = await fetch(url, { cache: "no-store" });
    if (respuesta.ok) {
      const datos = await respuesta.json();
      if (datos.status === "done") return datos.record;
      if (datos.status === "error") throw new Error("No se pudo procesar");
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
  throw new Error("Está tardando demasiado");
}

btn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  btn.disabled = true;
  progress.value = 0;
  status.textContent = "Subiendo imagen...";

  try {
    const objectName = await subirJpg(file, schoolInput.value.trim(), (p) => {
      progress.value = p;
      if (p >= 100) status.textContent = "Procesando con IA...";
    });

    status.textContent = "Procesando con IA...";
    const registro = await esperarResultado(objectName);

    status.textContent = "¡Listo! El dibujo se agregó correctamente.";
    console.log("Registro:", registro);
  } catch (error) {
    status.textContent = error.message;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
